name: Release

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Release Type"
        required: true
        type: choice
        default: "patch"
        options:
          - "major"
          - "minor"
          - "patch"
          - "build"

permissions:
  contents: write

env:
  GO_VERSION: '1.22.x'
  FLUTTER_VERSION: '3.44.9'

jobs:
  upgrade-version:
    name: Upgrade Version
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.set_version.outputs.versao }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcula nova versao
        id: set_version
        env:
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # build so fora da main, major/minor/patch so na main
          if [ "$BUILD_TYPE" = "build" ] && [ "$BRANCH" = "main" ]; then
            echo "::error::buildType 'build' nao pode ser usado na branch main"
            exit 1
          fi
          if [ "$BUILD_TYPE" != "build" ] && [ "$BRANCH" != "main" ]; then
            echo "::error::buildType '$BUILD_TYPE' so pode ser usado na branch main (branch atual: $BRANCH)"
            exit 1
          fi

          # A versao atual e a maior tag no formato vX.Y.Z ou vX.Y.Z-BUILD
          ATUAL=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' | sort -V | tail -n1)
          ATUAL=${ATUAL:-0.0.0}
          BASE=${ATUAL%%-*}
          BUILD=0
          if [[ "$ATUAL" == *-* ]]; then
            BUILD=${ATUAL##*-}
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          # major/minor/patch geram X.Y.Z (sem build), build gera X.Y.Z-N sobre a versao atual
          case "$BUILD_TYPE" in
            major) NOVA="v$((MAJOR + 1)).0.0" ;;
            minor) NOVA="v$MAJOR.$((MINOR + 1)).0" ;;
            patch) NOVA="v$MAJOR.$MINOR.$((PATCH + 1))" ;;
            build) NOVA="v$BASE-$((BUILD + 1))" ;;
            *) echo "::error::buildType invalido: $BUILD_TYPE"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/$NOVA" > /dev/null; then
            echo "::error::Tag $NOVA ja existe"
            exit 1
          fi

          echo "Versao atual: v$ATUAL -> Nova versao: $NOVA"
          echo "versao=$NOVA" >> "$GITHUB_OUTPUT"

  build-and-release-linux:
    name: Build and Release Linux
    needs: [ upgrade-version ]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.upgrade-version.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build api
        working-directory: api
        run: CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/dist/api" ./cmd/api

      - name: Build pdv
        working-directory: pdv
        run: |
          flutter pub get
          flutter build linux --release --build-name="${VERSION#v}"
          cp -r build/linux/x64/release/bundle/. "$GITHUB_WORKSPACE/dist/"

      - name: Archive Release
        run: |
          chmod +x dist/api dist/pdv
          cd dist
          zip -r "$GITHUB_WORKSPACE/poc-monorepo-${VERSION}-linux.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-linux
          path: poc-monorepo-${{ env.VERSION }}-linux.zip
          if-no-files-found: error
          retention-days: 1

  build-and-release-windows:
    name: Build and Release Windows
    needs: [ upgrade-version ]
    runs-on: windows-2022

    env:
      VERSION: ${{ needs.upgrade-version.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Build api
        working-directory: api
        env:
          CGO_ENABLED: '0'
        run: go build -o "$env:GITHUB_WORKSPACE\dist\api.exe" ./cmd/api

      - name: Build pdv
        working-directory: pdv
        run: |
          flutter pub get
          flutter build windows --release --build-name="$($env:VERSION.TrimStart('v'))"
          Copy-Item -Recurse -Path build\windows\x64\runner\Release\* -Destination "$env:GITHUB_WORKSPACE\dist"

      - name: Archive Release
        run: |
          Compress-Archive -Path dist\* -DestinationPath "poc-monorepo-$env:VERSION-windows.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-windows
          path: poc-monorepo-${{ env.VERSION }}-windows.zip
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create Tag and Release
    needs: [ upgrade-version, build-and-release-linux, build-and-release-windows ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.upgrade-version.outputs.versao }}
    steps:
      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          commit: ${{ github.sha }}
          artifacts: dist/*.zip
          generateReleaseNotes: true
          makeLatest: ${{ github.ref_name == 'main' }}
          prerelease: ${{ github.ref_name != 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Summary
        run: |
          echo "### Versão: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 - [Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }})" >> $GITHUB_STEP_SUMMARY